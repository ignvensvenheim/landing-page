server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_name intranet intranet.svenheim.no intranet.svenheim.lt;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    allow 192.168.1.0/24;
    allow 10.248.22.0/24;
    allow 10.248.20.0/24;
    allow 10.248.21.0/24;
    allow 10.248.18.0/24;
    allow 10.248.23.0/24;
    allow 10.248.24.0/24;
    allow 10.248.25.0/24;
    deny all;
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
    location /css/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    location /script/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    location /locales/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
server {
    listen 80;
    server_name zund zund.svenheim.no zund.svenheim.lt;
    allow 192.168.1.0/24;
    allow 10.248.22.0/24;
    allow 10.248.20.0/24;
    allow 10.248.21.0/24;
    allow 10.248.18.0/24;
    allow 10.248.23.0/24;
    allow 10.248.24.0/24;
    allow 10.248.25.0/24;
    deny all;
    location / {
        proxy_pass http://host.docker.internal:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
server {
    listen 80;
    server_name claims claims.svenheim.no claims.svenheim.lt;

    return 301 https://claims.svenheim.lt$request_uri;
}

server {
    listen 443 ssl;
    server_name claims.svenheim.no;

    ssl_certificate     /etc/letsencrypt/live/claims.svenheim.no/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/claims.svenheim.no/privkey.pem;

    return 301 https://claims.svenheim.lt$request_uri;
}

server {
    listen 443 ssl;
    server_name claims.svenheim.lt;

    ssl_certificate /etc/letsencrypt/live/claims.svenheim.lt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/claims.svenheim.lt/privkey.pem;

    allow 192.168.1.0/24;
    allow 10.248.18.0/24;
    allow 10.248.20.0/24;
    allow 10.248.21.0/24;
    allow 10.248.22.0/24;
    allow 10.248.23.0/24;
    allow 10.248.24.0/24;
    allow 10.248.25.0/24;
    deny all;

    location / {
        proxy_pass http://host.docker.internal:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}
