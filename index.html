<!doctype html>
<html lang="lt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Svenheim Tools</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./assets/favicon.png"
    />
    <script src="https://unpkg.com/i18next@23.6.0/dist/umd/i18next.min.js"></script>
    <script src="https://unpkg.com/i18next-http-backend@2.4.1/i18nextHttpBackend.min.js"></script>
    <script src="./script/script.js" defer></script>
  </head>
  <body>
    <header class="header">
      <div class="header-container">
        <a
          href="https://www.google.com"
          rel="noopener noreferrer"
          class="hidden-google"
        ></a>
        <a
          href="https://www.youtube.com"
          rel="noopener noreferrer"
          class="hidden-youtube"
        ></a>
        <div class="header-logo">
          <img src="./assets/logo.svg" alt="Svenheim Logo" />
        </div>
        <div class="header-sub-container">
          <div class="lang-toggle">
            <button data-lang="en" class="lang-btn active" type="button">
              EN
            </button>
            <button data-lang="lt" class="lang-btn" type="button">LT</button>
          </div>
          <div class="header-name">
            <p data-i18n="tools-label"></p>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section id="tools" class="features">
        <div class="container">
          <div class="features-grid" id="features-grid"></div>
        </div>
      </section>
    </main>
  </body>
</html>
